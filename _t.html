<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#ddd}iframe{display:block;width:1200px;height:3000px;border:0;background:#fff}</style></head>
<body><iframe id="f" src="index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument;
  d.getElementById('tab-mac').click();
  setTimeout(function () {
    var ipad = d.getElementById('strip-ipad').hidden, mac = d.getElementById('strip-mac').hidden;
    document.title = 'ipadHidden=' + ipad + ' macHidden=' + mac;
  }, 300);
});
</script></body></html>
